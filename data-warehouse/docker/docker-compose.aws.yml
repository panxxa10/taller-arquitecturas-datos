# Airflow en la EC2 (LocalExecutor + PostgreSQL de metadatos). Se opera con scripts/aws/ec2_airflow.sh
# Las credenciales de AWS llegan del rol de la instancia; las contraseñas de las bases se leen de Secrets Manager.
name: dw-airflow

x-airflow: &airflow
  image: local/dw-airflow:2.11.2
  build:
    context: .
    dockerfile: Dockerfile.aws
  env_file:
    - ../.env.aws          # variables NO secretas (hosts, ARN, nombres)
    - .env.airflow         # secretos propios de Airflow, generados en la EC2 (no se versionan)
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Bogota
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    PYTHONPATH: /opt/airflow/src
    DBT_TARGET: redshift
    DBT_PROJECT_DIR: /opt/airflow/src/dbt
    DBT_EXECUTABLE: /home/airflow/dbt-venv/bin/dbt
  user: "${AIRFLOW_UID:-1000}:0"
  volumes:
    - ../src/airflow/dags_aws:/opt/airflow/dags
    - ../src:/opt/airflow/src
    - /opt/certs:/opt/certs:ro
    - airflow_logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    command: version
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD}@postgres/airflow
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"   # solo accesible por túnel SSH
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow_logs:
  postgres_data:
